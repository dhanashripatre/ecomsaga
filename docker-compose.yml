version: '3.8'

services:
  ibm-mq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: ibm-mq
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=${MQ_QMGR_NAME}
      - MQ_APP_PASSWORD=${MQ_PASSWORD}
      - MQ_ADMIN_PASSWORD=${MQ_ADMIN_PASSWORD}
    ports:
      - "1414:1414"
      - "9443:9443"
    volumes:
      - ./mq-config/20-queues.mqsc:/etc/mqm/20-queues.mqsc
    networks:
      - ecom-network

  postgres-producer:
    image: postgres:15-alpine
    container_name: postgres-producer
    environment:
      - POSTGRES_DB=${PRODUCER_DB}
      - POSTGRES_USER=${PRODUCER_DB_USER}
      - POSTGRES_PASSWORD=${PRODUCER_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-producer-data:/var/lib/postgresql/data
    networks:
      - ecom-network

  postgres-inventory:
    image: postgres:15-alpine
    container_name: postgres-inventory
    environment:
      - POSTGRES_DB=${INVENTORY_DB}
      - POSTGRES_USER=${INVENTORY_DB_USER}
      - POSTGRES_PASSWORD=${INVENTORY_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    networks:
      - ecom-network

  postgres-payment:
    image: postgres:15-alpine
    container_name: postgres-payment
    environment:
      - POSTGRES_DB=${PAYMENT_DB}
      - POSTGRES_USER=${PAYMENT_DB_USER}
      - POSTGRES_PASSWORD=${PAYMENT_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    networks:
      - ecom-network

  postgres-notification:
    image: postgres:15-alpine
    container_name: postgres-notification
    environment:
      - POSTGRES_DB=${NOTIFICATION_DB}
      - POSTGRES_USER=${NOTIFICATION_DB_USER}
      - POSTGRES_PASSWORD=${NOTIFICATION_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks:
      - ecom-network

  order-producer-service:
    build:
      context: ./order-producer-service
    container_name: order-producer-service
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres-producer
      - DB_PORT=5432
      - DB_PASSWORD=${PRODUCER_DB_PASSWORD}
      - MQ_HOST=ibm-mq
      - MQ_PASSWORD=${MQ_PASSWORD}
    depends_on:
      - postgres-producer
      - ibm-mq
    networks:
      - ecom-network

  order-inventory-service:
    build:
      context: ./order-inventory-service
    container_name: order-inventory-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres-inventory
      - DB_PORT=5432
      - DB_PASSWORD=${INVENTORY_DB_PASSWORD}
      - MQ_HOST=ibm-mq
      - MQ_PASSWORD=${MQ_PASSWORD}
    depends_on:
      - postgres-inventory
      - ibm-mq
    networks:
      - ecom-network

  order-payment-service:
    build:
      context: ./order-payment-service
    container_name: order-payment-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres-payment
      - DB_PORT=5432
      - DB_PASSWORD=${PAYMENT_DB_PASSWORD}
      - MQ_HOST=ibm-mq
      - MQ_PASSWORD=${MQ_PASSWORD}
    depends_on:
      - postgres-payment
      - ibm-mq
    networks:
      - ecom-network

  order-notification-service:
    build:
      context: ./order-notification-service
    container_name: order-notification-service
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=postgres-notification
      - DB_PORT=5432
      - DB_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - MQ_HOST=ibm-mq
      - MQ_PASSWORD=${MQ_PASSWORD}
    depends_on:
      - postgres-notification
      - ibm-mq
    networks:
      - ecom-network

